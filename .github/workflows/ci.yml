name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # For the tests of the generated Java (skipped without a JDK).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: dotnet build FormatStudio.slnx -c Release
      - run: dotnet test FormatStudio.slnx -c Release --no-build
      # Fails on errors in the project too; the project's fuzz cases replace a roundtrip step. The cases also run
      # against the generated C# and Java.
      - name: Sample project
        run: >-
          dotnet run --project src/FormatStudio.Cli -c Release --no-build --
          test --project samples/java-protocol --target csharp --target csharp-stream --target java-stream
