name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # For the tests of the generated Java (skipped without a JDK).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: dotnet build FormatStudio.slnx -c Release
      - run: dotnet test FormatStudio.slnx -c Release --no-build
      - name: Sample project
        run: |
          cli="dotnet run --project src/FormatStudio.Cli -c Release --no-build --"
          $cli validate --project samples/java-protocol
          $cli samples --project samples/java-protocol
          $cli roundtrip --project samples/java-protocol --iterations 50
