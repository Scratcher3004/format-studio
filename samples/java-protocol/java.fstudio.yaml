name: java-protocol
description: >-
  A few packets of the Minecraft Java Edition protocol (1.20.x), as a sample of a big-endian format with VarInts,
  packed positions, externally tagged variants, conditional fields and Java NBT.
version: "765"
defaults:
  endian: big
  length: varint32
  string: utf8
  nbt: java-network
sources:
  - types/**/*.yaml
  - packets/**/*.yaml
tests:
  - tests/**/*.yaml
# Packet ids are only unique within a state and direction; each protocol gets a registry of its own.
protocols:
  - name: HandshakingServerbound
    groups: [handshaking, serverbound]
  - name: StatusServerbound
    groups: [status, serverbound]
  - name: LoginServerbound
    groups: [login, serverbound]
  - name: PlayClientbound
    groups: [play, clientbound]
